name: Run GUI Automation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyautogui pillow rapidocr_onnxruntime

      - name: Run Main Script
        run: |
          python ocrandclick.py

      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-screenshot
          path: abcd1234.png
          if-no-files-found: ignore

      - name: Commit and Push Log and Screenshot
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ocrandclick.log abcd1234.png
          git commit -m "chore(ci): save ocrandclick.log and abcd1234.png [skip ci]" || echo "No changes to commit"
          git push origin main
