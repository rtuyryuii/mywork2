name: Windows Native Chrome Auto Register

on:
  workflow_dispatch:

jobs:
  auto-register:
    runs-on: windows-latest
    permissions:
      contents: write  # 👈 关键点：显式赋予修改和推送代码的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整提交历史，确保 push 顺畅

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyautogui pyperclip rapidocr_onnxruntime pillow

      - name: Execute Automation via run.py
        run: |
          python run.py
