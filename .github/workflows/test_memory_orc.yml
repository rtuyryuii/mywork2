name: Test In-Memory OCR Without Disk Landing

on:
  workflow_dispatch:

jobs:
  test-memory-ocr:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Launch Edge and Run Memory-Only OCR Test
        shell: powershell
        run: |
          $logFile = "$PWD\ocr_result.txt"
          "================ In-Memory OCR Test Start ================" | Out-File -FilePath $logFile -Encoding utf8

          function Write-TestLog {
              param([string]$Message)
              $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              $logLine = "$time - $Message"
              Write-Host $logLine
              $logLine | Out-File -FilePath $logFile -Append -Encoding utf8
          }

          try {
              # 1. 启动 Edge 并最大化窗口
              Write-TestLog "Launching Microsoft Edge..."
              Start-Process "msedge.exe" -ArgumentList "https://account.microsoft.com/account", "--start-maximized"
              
              Write-TestLog "Waiting 10 seconds for Edge to load..."
              Start-Sleep -Seconds 10

              # 2. 内存中捕获屏幕 (Bitmap -> MemoryStream)
              Write-TestLog "Capturing screen directly into System.IO.MemoryStream..."
              Add-Type -AssemblyName System.Drawing
              Add-Type -AssemblyName System.Windows.Forms

              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($bmp)
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $graphics.Dispose()

              $ms = New-Object System.IO.MemoryStream
              $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
              $bmp.Dispose()
              $bytes = $ms.ToArray()
              $ms.Dispose()

              Write-TestLog "Screen captured into memory. Byte array length: $($bytes.Length) bytes."

              # 3. 加载 WinRT OCR 必备程序集
              Write-TestLog "Loading WinRT OCR assemblies..."
              $null = [Windows.Globalization.Language, Windows.Globalization, ContentType=WindowsRuntime]
              $null = [Windows.Media.Ocr.OcrEngine, Windows.Foundation.UniversalApiContract, ContentType=WindowsRuntime]
              $null = [Windows.Graphics.Imaging.BitmapDecoder, Windows.Foundation.UniversalApiContract, ContentType=WindowsRuntime]
              $null = [Windows.Storage.Streams.InMemoryRandomAccessStream, Windows.Foundation.UniversalApiContract, ContentType=WindowsRuntime]

              # 4. 将 Byte 数组写入 WinRT InMemoryRandomAccessStream (规避 AsRandomAccessStream)
              Write-TestLog "Converting byte array to WinRT InMemoryRandomAccessStream..."
              $randomAccessStream = New-Object Windows.Storage.Streams.InMemoryRandomAccessStream
              $writer = New-Object Windows.Storage.Streams.DataWriter($randomAccessStream)
              $writer.WriteBytes($bytes)
              
              # 同步等待 DataWriter 存储完成
              $storeTask = $writer.StoreAsync().AsTask()
              $storeTask.Wait()
              $writer.DetachStream()
              $writer.Dispose()

              # 重置流位置到起点
              $randomAccessStream.Seek(0)

              # 5. 解码图片并调用 WinRT OCR
              Write-TestLog "Initializing BitmapDecoder and OcrEngine..."
              $decoderTask = [Windows.Graphics.Imaging.BitmapDecoder]::CreateAsync($randomAccessStream).AsTask()
              $decoderTask.Wait()
              $decoder = $decoderTask.Result

              $softwareBitmapTask = $decoder.GetSoftwareBitmapAsync().AsTask()
              $softwareBitmapTask.Wait()
              $softwareBitmap = $softwareBitmapTask.Result

              # 动态选取系统语言或默认英文
              $language = New-Object Windows.Globalization.Language("en-US")
              $ocrEngine = [Windows.Media.Ocr.OcrEngine]::TryCreateFromLanguage($language)

              if ($null -eq $ocrEngine) {
                  $ocrEngine = [Windows.Media.Ocr.OcrEngine]::TryCreateFromUserProfileLanguage()
              }

              Write-TestLog "Executing OCR Engine recognizer..."
              $ocrTask = $ocrEngine.RecognizeAsync($softwareBitmap).AsTask()
              $ocrTask.Wait()
              $ocrResult = $ocrTask.Result

              # 6. 解析识别结果并输出
              Write-TestLog "----------------- OCR RECOGNIZED TEXT -----------------"
              if ($ocrResult.Text) {
                  Write-TestLog "SUCCESS: Recognized Text Content:"
                  Write-TestLog $ocrResult.Text
              } else {
                  Write-TestLog "WARNING: OCR executed successfully, but no text was recognized on the screen."
              }
              Write-TestLog "------------------------------------------------------"

          } catch {
              Write-TestLog "ERROR: An exception occurred during memory OCR execution!"
              Write-TestLog "Exception Message: $($_.Exception.Message)"
              Write-TestLog "Exception Details:`n$($_ | Out-String)"
          } finally {
              Write-TestLog "================ In-Memory OCR Test Ended ================"
          }

      - name: Upload OCR Output Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-test-results
          path: ocr_result.txt
