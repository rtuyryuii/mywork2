name: Test In-Memory OCR V2

on:
  workflow_dispatch:

jobs:
  test-memory-ocr:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Launch Edge and Run Memory-Only OCR Test
        shell: powershell
        run: |
          $logFile = "$PWD\\ocr_result.txt"
          "================ In-Memory OCR Test Start ================" | Out-File -FilePath $logFile -Encoding utf8

          function Write-TestLog {
              param([string]$Message)
              $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              $logLine = "$time - $Message"
              Write-Host $logLine
              $logLine | Out-File -FilePath $logFile -Append -Encoding utf8
          }

          try {
              Write-TestLog "Launching Microsoft Edge..."
              Start-Process "msedge.exe" -ArgumentList "https://account.microsoft.com/account", "--start-maximized"
              
              Write-TestLog "Waiting 10 seconds for Edge to load..."
              Start-Sleep -Seconds 10

              Write-TestLog "Capturing screen directly into System.IO.MemoryStream..."
              Add-Type -AssemblyName System.Drawing
              Add-Type -AssemblyName System.Windows.Forms

              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($bmp)
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $graphics.Dispose()

              $ms = New-Object System.IO.MemoryStream
              $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
              $bmp.Dispose()
              $bytes = $ms.ToArray()
              $ms.Dispose()

              Write-TestLog "Screen captured into memory. Byte array length: $($bytes.Length) bytes."

              Write-TestLog "Loading WinRT OCR Assemblies into PowerShell..."
              $null = [Windows.Graphics.Imaging.BitmapDecoder, Windows.Graphics, ContentType=WindowsRuntime]
              $null = [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType=WindowsRuntime]
              $null = [Windows.Storage.Streams.InMemoryRandomAccessStream, Windows.Storage.Streams, ContentType=WindowsRuntime]
              $null = [Windows.Globalization.Language, Windows.Globalization, ContentType=WindowsRuntime]

              Write-TestLog "Converting byte array to WinRT IRandomAccessStream..."
              $stream = New-Object Windows.Storage.Streams.InMemoryRandomAccessStream
              $writer = New-Object Windows.Storage.Streams.DataWriter($stream)
              $writer.WriteBytes($bytes)
              $null = $writer.StoreAsync().AsTask().GetAwaiter().GetResult()
              $null = $writer.FlushAsync().AsTask().GetAwaiter().GetResult()
              $writer.DetachStream()
              $stream.Seek(0)

              Write-TestLog "Decoding image and executing WinRT OCR Engine..."
              $decoderTask = [Windows.Graphics.Imaging.BitmapDecoder]::CreateAsync($stream).AsTask()
              $decoder = $decoderTask.GetAwaiter().GetResult()

              $softBmpTask = $decoder.GetSoftwareBitmapAsync().AsTask()
              $softBmp = $softBmpTask.GetAwaiter().GetResult()

              $lang = New-Object Windows.Globalization.Language("en-US")
              $engine = [Windows.Media.Ocr.OcrEngine]::TryCreateFromLanguage($lang)
              if (-not $engine) {
                  $engine = [Windows.Media.Ocr.OcrEngine]::TryCreateFromUserProfileLanguages()
              }

              $ocrResultTask = $engine.RecognizeAsync($softBmp).AsTask()
              $ocrResult = $ocrResultTask.GetAwaiter().GetResult()
              $ocrText = $ocrResult.Text

              Write-TestLog "----------------- OCR RECOGNIZED TEXT -----------------"
              if ($ocrText) {
                  Write-TestLog "SUCCESS: Recognized Text Content:"
                  Write-TestLog $ocrText
              } else {
                  Write-TestLog "WARNING: OCR executed successfully, but no text was recognized on the screen."
              }
              Write-TestLog "------------------------------------------------------"

          } catch {
              Write-TestLog "ERROR: An exception occurred during memory OCR execution!"
              Write-TestLog "Exception Message: $($_.Exception.Message)"
              Write-TestLog "Exception Details:`n$($_ | Out-String)"
          } finally {
              Write-TestLog "================ In-Memory OCR Test Ended ================"
          }

      - name: Upload OCR Output Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-test-results
          path: ocr_result.txt
