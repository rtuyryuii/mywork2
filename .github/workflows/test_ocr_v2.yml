name: Test In-Memory OCR V2

on:
  workflow_dispatch:

jobs:
  test-memory-ocr:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Launch Edge and Run Memory-Only OCR Test
        shell: powershell
        run: |
          $logFile = "$PWD\\ocr_result.txt"
          "================ In-Memory OCR Test Start ================" | Out-File -FilePath $logFile -Encoding utf8

          function Write-TestLog {
              param([string]$Message)
              $time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              $logLine = "$time - $Message"
              Write-Host $logLine
              $logLine | Out-File -FilePath $logFile -Append -Encoding utf8
          }

          try {
              Write-TestLog "Launching Microsoft Edge..."
              Start-Process "msedge.exe" -ArgumentList "https://account.microsoft.com/account", "--start-maximized"
              
              Write-TestLog "Waiting 10 seconds for Edge to load..."
              Start-Sleep -Seconds 10

              Write-TestLog "Capturing screen directly into MemoryStream..."
              Add-Type -AssemblyName System.Drawing
              Add-Type -AssemblyName System.Windows.Forms

              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($bmp)
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $graphics.Dispose()

              $ms = New-Object System.IO.MemoryStream
              $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
              $bmp.Dispose()
              $bytes = $ms.ToArray()
              $ms.Dispose()

              Write-TestLog "Screen captured into memory. Byte array length: $($bytes.Length) bytes."

              Write-TestLog "Compiling Native C# WinRT OCR Helper for PowerShell 5.1..."
              $code = @"
              using System;
              using System.IO;
              using System.Threading.Tasks;
              using Windows.Globalization;
              using Windows.Graphics.Imaging;
              using Windows.Media.Ocr;
              using Windows.Storage.Streams;

              public class NativeOcr
              {
                  public static string Recognize(byte[] imageBytes)
                  {
                      return Task.Run(async () =>
                      {
                          using (var ms = new InMemoryRandomAccessStream())
                          {
                              using (var writer = new DataWriter(ms.GetOutputStreamAt(0)))
                              {
                                  writer.WriteBytes(imageBytes);
                                  await writer.StoreAsync();
                                  await writer.FlushAsync();
                                  writer.DetachStream();
                              }
                              ms.Seek(0);

                              var decoder = await BitmapDecoder.CreateAsync(ms);
                              var softwareBitmap = await decoder.GetSoftwareBitmapAsync();

                              var engine = OcrEngine.TryCreateFromUserProfileLanguages() 
                                        ?? OcrEngine.TryCreateFromLanguage(new Language("en-US"));

                              var result = await engine.RecognizeAsync(softwareBitmap);
                              return result.Text;
                          }
                      }).GetAwaiter().GetResult();
                  }
              }
"@
              $winmdFoundation = "C:\Windows\System32\WinMetadata\Windows.Foundation.winmd"
              $winmdMedia = "C:\Windows\System32\WinMetadata\Windows.Media.winmd"
              $winmdGraphics = "C:\Windows\System32\WinMetadata\Windows.Graphics.winmd"
              $winmdGlob = "C:\Windows\System32\WinMetadata\Windows.Globalization.winmd"

              Add-Type -TypeDefinition $code -ReferencedAssemblies $winmdFoundation, $winmdMedia, $winmdGraphics, $winmdGlob, "System.Runtime.WindowsRuntime.dll"

              Write-TestLog "Executing Native C# WinRT OCR..."
              $ocrText = [NativeOcr]::Recognize($bytes)

              Write-TestLog "----------------- OCR RECOGNIZED TEXT -----------------"
              if ($ocrText) {
                  Write-TestLog "SUCCESS: Recognized Text Content:"
                  Write-TestLog $ocrText
              } else {
                  Write-TestLog "WARNING: OCR executed successfully, but no text was recognized on the screen."
              }
              Write-TestLog "------------------------------------------------------"

          } catch {
              Write-TestLog "ERROR: An exception occurred during memory OCR execution!"
              Write-TestLog "Exception Message: $($_.Exception.Message)"
              Write-TestLog "Exception Details:`n$($_ | Out-String)"
          } finally {
              Write-TestLog "================ In-Memory OCR Test Ended ================"
          }

      - name: Upload OCR Output Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-test-results
          path: ocr_result.txt
