name: Test Native OCR Only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ocr-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Ensure English OCR Language Pack is Installed
      shell: powershell
      run: |
        try {
            $capability = Get-WindowsCapability -Online | Where-Object Name -like "Language.Basic~~~en-US*"
            if ($capability.State -ne "Installed") {
                Add-WindowsCapability -Online -Name "Language.Basic~~~en-US~0.0.1.0"
            }
        } catch {
            Write-Host "Language pack check skipped: $_"
        }

    - name: Execute OCR Recognition Test
      shell: powershell
      run: |
        $ImgPath = Join-Path $env:GITHUB_WORKSPACE "shot_20260826_055738_0112.png"
        $TxtPath = Join-Path $env:GITHUB_WORKSPACE "shot_20260826_055738_0112.txt"

        try {
            if (-not (Test-Path $ImgPath)) {
                throw "Image file not found: $ImgPath"
            }

            # 显式加载所有相关的 WinRT 程序集
            Add-Type -AssemblyName System.Runtime.WindowsRuntime
            $null = [Windows.Storage.StorageFile, Windows.Storage, Version=255.255.255.255, Culture=neutral, PublicKeyToken=null, ContentType=WindowsRuntime]
            $null = [Windows.Graphics.Imaging.BitmapDecoder, Windows.Graphics.Imaging, Version=255.255.255.255, Culture=neutral, PublicKeyToken=null, ContentType=WindowsRuntime]
            $null = [Windows.Media.Ocr.OcrEngine, Windows.Media.Ocr, Version=255.255.255.255, Culture=neutral, PublicKeyToken=null, ContentType=WindowsRuntime]
            $null = [Windows.Globalization.Language, Windows.Globalization, Version=255.255.255.255, Culture=neutral, PublicKeyToken=null, ContentType=WindowsRuntime]

            $asTaskGeneric = ([System.WindowsRuntimeSystemExtensions].GetMethods() | Where-Object { 
                $_.Name -eq 'AsTask' -and $_.GetParameters().Count -eq 1 -and $_.GetParameters()[0].ParameterType.Name -eq 'IAsyncOperation`1' 
            })[0]

            function Await-WinRt($WinRtTask, $ResultType) {
                $asTask = $asTaskGeneric.MakeGenericMethod($ResultType)
                $netTask = $asTask.Invoke($null, @($WinRtTask))
                $netTask.Wait(-1) | Out-Null
                return $netTask.Result
            }

            $fileAsync = [Windows.Storage.StorageFile]::GetFileFromPathAsync($ImgPath)
            $file = Await-WinRt $fileAsync ([Windows.Storage.StorageFile])

            $streamAsync = $file.OpenAsync([Windows.Storage.FileAccessMode]::Read)
            $stream = Await-WinRt $streamAsync ([Windows.Storage.Streams.IRandomAccessStream])

            $decoderAsync = [Windows.Graphics.Imaging.BitmapDecoder]::CreateAsync($stream)
            $decoder = Await-WinRt $decoderAsync ([Windows.Graphics.Imaging.BitmapDecoder])

            $bitmapAsync = $decoder.GetSoftwareBitmapAsync()
            $softwareBitmap = Await-WinRt $bitmapAsync ([Windows.Graphics.Imaging.SoftwareBitmap])

            $engine = [Windows.Media.Ocr.OcrEngine]::TryCreateFromLanguage([Windows.Globalization.Language]::new("en-US"))
            if (-not $engine) {
                $engine = [Windows.Media.Ocr.OcrEngine]::TryCreateFromUserProfileLanguages()
            }

            $ocrAsync = $engine.RecognizeAsync($softwareBitmap)
            $ocrResult = Await-WinRt $ocrAsync ([Windows.Media.Ocr.OcrResult])

            $lines = @("=== OCR SUCCESS ===")
            foreach ($line in $ocrResult.Lines) {
                $lines += $line.Text
            }
            $lines -join "`r`n" | Set-Content -Path $TxtPath -Encoding UTF8

        } catch {
            $errDetails = "=== OCR FAILED ===`r`nTimestamp: $(Get-Date)`r`nError: $_`r`nStacktrace:`r`n$($_.ScriptStackTrace)"
            $errDetails | Set-Content -Path $TxtPath -Encoding UTF8
        }

    - name: Commit and Push Result
      shell: powershell
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        git add shot_20260826_055738_0112.txt
        
        $gitStatus = git status --porcelain
        if ($gitStatus) {
            Write-Host "[INFO] Changes detected. Committing and pushing to remote..."
            git commit -m "chore(ci): update ocr test result txt [skip ci]"
            
            git pull origin main --rebase
            git push origin HEAD:main

            if ($LASTEXITCODE -ne 0) {
                Write-Error "[ERROR] git push failed with Exit Code: $LASTEXITCODE"
                exit $LASTEXITCODE
            }
            Write-Host "[SUCCESS] OCR result successfully updated and pushed to origin/main!" -ForegroundColor Green
        } else {
            Write-Host "[WARN] No file changes detected to commit." -ForegroundColor Yellow
        }
