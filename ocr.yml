name: Run OCR Test Only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ocr-test:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyautogui pillow rapidocr_onnxruntime

      - name: Run OCR Test
        run: |
          python ocr.py

      - name: Commit and Push Log Artifact
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ocr.log
          git commit -m "chore(ci): update OCR test log [skip ci]" || echo "No log changes"
          git push origin main
